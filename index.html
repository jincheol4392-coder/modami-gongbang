<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모담이 공방 | 커플 향수 원데이 클래스</title>
  <meta name="description" content="영천시 완산동 모담이 공방. 두 사람이 함께 나만의 향수를 만드는 커플 원데이 클래스예요. 금요일 2시, 2시간, 2인 20,000원.">
  <meta property="og:title" content="모담이 공방 | 커플 향수 원데이 클래스">
  <meta property="og:description" content="둘이 함께 만드는, 세상에 하나뿐인 우리의 향. 영천시 완산동 금요일 2시, 2인 20,000원.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#E6E4E0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='11' y='2' width='10' height='7' fill='%23E9D9BE'/%3E%3Cpath d='M5 13h11v17H8l-3-3z' fill='%238C4A36'/%3E%3Cpath d='M16 13h11v14l-3 3h-8z' fill='%23C8902F'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#">모담이 공방</a>
    <a class="kakao kakao--small" href="#contact">문의하기</a>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__text">
        <p class="hero__place">영천시 완산동 커플 향수 원데이 클래스</p>
        <h1 id="hero-title" class="hero__title">둘이 함께 만드는,<br>세상에 하나뿐인<br>우리의 향</h1>
        <p class="hero__lede">모담이 공방에서 두 사람이 함께 나만의 향수를 만들어요. 금요일 오후 2시, 두 시간 동안 진행해요.</p>
        <a class="kakao" href="#contact">문의 남기기</a>
      </div>

      <figure class="bottle" aria-hidden="true">
        <svg viewBox="0 0 300 440" role="presentation">
          <ellipse class="bottle__shadow" cx="150" cy="420" rx="120" ry="10"/>
          <g class="bottle__cap">
            <polygon points="112,30 188,30 200,50 200,104 100,104 100,50" fill="#E9D9BE"/>
            <path d="M118 44v56M136 38v62M158 40v60M178 44v56" stroke="#D6C19E" stroke-width="1.2"/>
            <rect x="124" y="104" width="52" height="40" fill="#D6C19E"/>
          </g>
          <polygon class="bottle__left" points="58,144 150,144 150,404 58,404 30,376 30,172" fill="#8C4A36"/>
          <polygon class="bottle__right" points="150,144 242,144 270,172 270,376 242,404 150,404" fill="#C8902F"/>
          <g class="bottle__label">
            <rect x="92" y="236" width="116" height="84" fill="#F3F1ED"/>
            <text x="150" y="276" text-anchor="middle" class="bottle__name">모담이</text>
            <text x="150" y="302" text-anchor="middle" class="bottle__sub">우리의 향</text>
          </g>
        </svg>
      </figure>
    </section>

    <section class="info" aria-labelledby="info-title">
      <div class="label-card">
        <h2 id="info-title" class="label-card__title">클래스 안내</h2>
        <dl class="facts">
          <div><dt>만드는 것</dt><dd>향수</dd></div>
          <div><dt>가격</dt><dd>2인 20,000원</dd></div>
          <div><dt>시간</dt><dd>금요일 2시부터 2시간</dd></div>
          <div><dt>장소</dt><dd>영천시 완산동 모담이 공방</dd></div>
        </dl>
      </div>
    </section>

    <section class="photos" id="photos" aria-labelledby="photos-title" hidden>
      <h2 id="photos-title" class="section-title">공방과 수업 모습</h2>
      <div class="photos__grid"></div>
    </section>

    <!-- 후기 자리: 실제 후기가 생기면 여기에 넣어요. -->

    <section class="closing" id="contact" aria-labelledby="closing-title">
      <h2 id="closing-title" class="closing__title">금요일 오후,<br>둘만의 향을 만들러 오세요</h2>
      <p class="closing__lede">이름과 연락처를 남겨 주시면 확인 후 연락드릴게요.</p>

      <form class="inquiry" id="inquiry" novalidate>
        <div class="field">
          <label for="f-name">이름</label>
          <input id="f-name" name="name" autocomplete="name" maxlength="50" required>
        </div>
        <div class="field">
          <label for="f-contact">연락처</label>
          <input id="f-contact" name="contact" type="tel" autocomplete="tel" maxlength="100" placeholder="휴대폰 번호" required>
        </div>
        <div class="field">
          <label for="f-date">원하는 날짜 <span class="optional">(선택)</span></label>
          <input id="f-date" name="message" maxlength="200" placeholder="예: 11월 셋째 주 금요일">
        </div>
        <div class="hp" aria-hidden="true">
          <label for="f-website">웹사이트</label>
          <input id="f-website" name="website" tabindex="-1" autocomplete="off">
        </div>
        <label class="consent">
          <input id="f-consent" type="checkbox" required>
          <span>(필수) 문의에 답하기 위해 이름·연락처를 받아요. 상담이 끝나면 지워요.</span>
        </label>
        <button class="kakao kakao--light inquiry__submit" type="submit">문의 남기기</button>
        <p class="inquiry__status" id="inquiry-status" role="status" hidden></p>
      </form>

      <a class="kakao kakao--line" data-kakao hidden>
        <svg class="kakao__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7l-1 3.6c-.1.3.3.6.6.4l4.2-2.8c.5.1 1 .1 1.5.1 5.5 0 10-3.6 10-8S17.5 3 12 3z" fill="currentColor"/></svg>
        <span>카카오톡으로 문의하기</span>
      </a>
    </section>
  </main>

  <footer class="foot">
    <p>모담이 공방</p>
    <p>영천시 완산동</p>
  </footer>

  <script src="site.js"></script>
</body>
</html>
